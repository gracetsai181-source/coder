<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 黑貓網球挑戰賽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a202c;
            color: white;
            font-family: 'Inter', sans-serif;
            touch-action: none; 
        }
        body.playing #game-container {
            cursor: none; /* 遊戲進行中隱藏滑鼠游標，實現 1:1 沉浸操控 */
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .header-ui {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto; 
            z-index: 20;
        }
        .score-board {
            display: flex;
            justify-content: center;
            gap: 40px;
            font-size: 4rem;
            font-weight: 900;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8);
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }
        /* 將結算畫面的元素分散到上下，把中央空出來給 3D 動畫 */
        .game-over-top {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 20;
            width: 100%;
        }
        .game-over-bottom {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 20;
            width: 100%;
        }
        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        .hidden { display: none !important; }
        .btn {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            padding: 15px 50px;
            border-radius: 9999px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            transition: all 0.2s;
            pointer-events: auto;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.6);
        }
        .btn:active { transform: translateY(0); }
        .quit-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
        }
        .quit-btn:hover {
            background: rgba(255, 50, 50, 0.5);
            border-color: rgba(255, 50, 50, 1);
        }
        .info-pill {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 9999px;
            font-weight: bold;
            font-size: 1.2rem;
            backdrop-filter: blur(5px);
        }
        #controls-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            background: rgba(0,0,0,0.4);
            padding: 8px 16px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <div id="ui-layer">
        <div class="header-ui">
            <button id="quit-btn" class="quit-btn hidden">返回選單</button>
            <div id="ball-count-el" class="info-pill text-blue-300 hidden">球數: 1 / 5</div>
        </div>
        
        <div class="score-board">
            <div class="flex flex-col items-center">
                <span class="text-sm text-gray-300 font-normal mb-[-10px]">玩家</span>
                <div id="player-score" class="text-pink-400">0</div>
            </div>
            <div class="text-gray-500 self-end mb-4">:</div>
            <div class="flex flex-col items-center">
                <span class="text-sm text-gray-300 font-normal mb-[-10px]">黑貓</span>
                <div id="ai-score" class="text-blue-400">0</div>
            </div>
        </div>
        <div id="controls-hint">👆 滑鼠就是球拍！發球極快，注意落點防守！</div>
    </div>

    <div id="start-screen">
        <h1 class="text-6xl font-black mb-4 tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-blue-500 text-center" style="text-shadow: 0 10px 20px rgba(0,0,0,0.3);">極速網球生死戰</h1>
        <p class="text-xl mb-10 text-gray-300 bg-black/40 px-6 py-3 rounded-full border border-gray-600">縮小的球拍，2倍速的砲彈平擊球！</p>
        <button id="start-btn" class="btn">開始極限挑戰</button>
    </div>

    <!-- 遊戲結束畫面 -->
    <div id="game-over-screen" class="hidden">
        <div class="game-over-top">
            <h1 id="winner-text" class="text-7xl font-black mb-2 text-white drop-shadow-lg tracking-wider">比賽結束</h1>
            <p id="winner-sub" class="text-xl text-gray-300 font-bold tracking-widest drop-shadow-md">GAME OVER</p>
        </div>
        
        <div class="game-over-bottom">
            <p id="score-text" class="text-3xl text-gray-200 bg-black/80 px-10 py-5 rounded-2xl border border-gray-600 shadow-2xl">
                玩家 <span id="final-player-score" class="text-pink-400 font-black text-5xl mx-3">0</span> 
                - 
                <span id="final-ai-score" class="text-blue-400 font-black text-5xl mx-3">0</span> 黑貓
            </p>
            <button id="restart-btn" class="btn">重新挑戰</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let world;
        let ball, paddle1, catMachine;
        let armL, armR; 
        
        // 勝利 8+9 貓與失敗猴子
        let bossCat, bossArmL, bossArmR;
        let monkey, monkeyArmL, monkeyArmR; 
        
        let ballBody;
        let animationId;
        let time = 0; 
        
        let shakeIntensity = 0;
        // 攝影機微調：壓低並拉近，增加臨場速度感
        const defaultCameraPos = new THREE.Vector3(0, 10, 32); 
        
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const RACKET_Z_PLANE = 22; // 玩家球拍固定的平面
        
        const gameState = {
            isPlaying: false,
            ballInPlay: false, // 防止重複計分的狀態鎖
            isPreparingServe: false, // 是否正在轉向準備發球
            targetServeAngle: 0, // 貓咪準備發球的目標面向角度
            victoryDance: false,
            loseDance: false, 
            score: { player: 0, ai: 0 },
            ballsPlayed: 0,
            maxBalls: 5,
            tableWidth: 26,
            tableLength: 50
        };

        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const playerScoreEl = document.getElementById('player-score');
        const aiScoreEl = document.getElementById('ai-score');
        const ballCountEl = document.getElementById('ball-count-el');
        const winnerText = document.getElementById('winner-text');
        const winnerSub = document.getElementById('winner-sub');
        const scoreText = document.getElementById('score-text');
        const restartBtn = document.getElementById('restart-btn');
        const quitBtn = document.getElementById('quit-btn');
        
        let hitSynth, wallSynth, gameOverSynth;
        let bgmLoops = []; // 存放所有背景音樂迴圈
        let isAudioInitialized = false;

        function initAudio() {
            if (isAudioInitialized) return;
            
            // 擊球音效
            hitSynth = new Tone.MembraneSynth({
                pitchDecay: 0.05,
                octaves: 4,
                oscillator: { type: "square" },
                envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0.1 }
            }).toDestination();
            hitSynth.volume.value = 8;

            // 落地/出界音效
            wallSynth = new Tone.MetalSynth({
                frequency: 200,
                envelope: { attack: 0.001, decay: 0.1, release: 0.01 },
                harmonicity: 5.1,
                modulationIndex: 32,
                resonance: 4000,
                octaves: 1.5
            }).toDestination();
            wallSynth.volume.value = -10;

            // 結算音效
            gameOverSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: { attack: 0.1, decay: 0.2, sustain: 0.5, release: 0.5 }
            }).toDestination();
            gameOverSynth.volume.value = -5;

            // 街機電音 BGM (多層次)
            const kick = new Tone.MembraneSynth({
                pitchDecay: 0.1, octaves: 4, oscillator: { type: "square" },
                envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0.1 }
            }).toDestination();
            kick.volume.value = -2;

            const bass = new Tone.FMSynth({
                harmonicity: 1, modulationIndex: 2, oscillator: { type: "sawtooth" },
                envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.5 },
                modulation: { type: "square" },
                modulationEnvelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 }
            }).toDestination();
            bass.volume.value = -6;

            const lead = new Tone.Synth({
                oscillator: { type: "square" },
                envelope: { attack: 0.01, decay: 0.1, sustain: 0.2, release: 1 }
            }).toDestination();
            lead.volume.value = -10;

            bgmLoops = [];
            
            // 4/4 節拍大鼓
            const kickLoop = new Tone.Loop(t => { kick.triggerAttackRelease("C1", "8n", t); }, "4n");
            bgmLoops.push(kickLoop);

            // 8分音符貝斯線
            const bassPattern = ["C2", "C2", "Eb2", "C2", "F2", "C2", "Bb1", "G1"];
            let bassStep = 0;
            const bassLoop = new Tone.Loop(t => {
                bass.triggerAttackRelease(bassPattern[bassStep % bassPattern.length], "16n", t);
                bassStep++;
            }, "8n");
            bgmLoops.push(bassLoop);

            // 16分音符琶音點綴
            const arpPattern = ["C4", "G4", "C5", "Eb5"];
            let arpStep = 0;
            const arpLoop = new Tone.Loop(t => {
                if (Math.random() > 0.3) {
                    lead.triggerAttackRelease(arpPattern[arpStep % arpPattern.length], "16n", t);
                }
                arpStep++;
            }, "16n");
            bgmLoops.push(arpLoop);

            Tone.Transport.bpm.value = 145; // 高BPM，節奏緊湊
            isAudioInitialized = true;
        }

        function initGraphics() {
            const container = document.getElementById('game-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e293b); 
            scene.fog = new THREE.FogExp2(0x1e293b, 0.015);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(defaultCameraPos);
            camera.lookAt(0, 4, -10); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(15, 30, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);
        }

        function initPhysics() {
            world = new CANNON.World();
            world.gravity.set(0, -35, 0); 
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 10;
            return new CANNON.Material("standard");
        }

        function createObjects(physicsMaterial) {
            // --- 網球場 ---
            const tableGeo = new THREE.BoxGeometry(gameState.tableWidth, 0.5, gameState.tableLength);
            const tableMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.8, metalness: 0.1 });
            const tableMesh = new THREE.Mesh(tableGeo, tableMat);
            tableMesh.position.y = -0.25;
            tableMesh.receiveShadow = true;
            scene.add(tableMesh);

            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const centerLine = new THREE.Mesh(new THREE.BoxGeometry(gameState.tableWidth, 0.6, 0.4), lineMat);
            scene.add(centerLine);
            
            const netGeo = new THREE.BoxGeometry(gameState.tableWidth + 2, 2.5, 0.1);
            const netMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.4, wireframe: true });
            const netMesh = new THREE.Mesh(netGeo, netMat);
            netMesh.position.y = 1.25;
            scene.add(netMesh);

            // --- 網球 ---
            const ballRadius = 0.6;
            const ballGeo = new THREE.SphereGeometry(ballRadius, 32, 32);
            const ballMat = new THREE.MeshStandardMaterial({ color: 0xccff00, roughness: 0.2, emissive: 0x334400 });
            ball = new THREE.Mesh(ballGeo, ballMat);
            ball.castShadow = true;
            scene.add(ball);

            ballBody = new CANNON.Body({ 
                mass: 1, 
                shape: new CANNON.Sphere(ballRadius),
                material: physicsMaterial,
                linearDamping: 0.01, angularDamping: 0.1
            });
            world.addBody(ballBody);

            // --- 粉紅網球拍 (大幅縮小，增加挑戰) ---
            paddle1 = new THREE.Group();
            const frameGeo = new THREE.TorusGeometry(2.2, 0.3, 16, 50);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0xff1493, roughness: 0.3, metalness: 0.4 }); 
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.castShadow = true;
            paddle1.add(frame);
            
            const stringsGeo = new THREE.CylinderGeometry(2.1, 2.1, 0.05, 32);
            const stringsMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, wireframe: true });
            const strings = new THREE.Mesh(stringsGeo, stringsMat);
            strings.rotation.x = Math.PI / 2;
            paddle1.add(strings);
            
            const handleGeo = new THREE.CylinderGeometry(0.35, 0.35, 4.5, 16);
            const handleMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.y = -4.5;
            handle.castShadow = true;
            paddle1.add(handle);
            
            paddle1.scale.set(0.6, 0.6, 0.6); // 尺寸縮小為原本的60%
            scene.add(paddle1);
            paddle1.position.set(0, 5, RACKET_Z_PLANE); 

            // --- 敵方：原始黑貓發球機 ---
            catMachine = new THREE.Group();
            const blackMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7 });
            const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 });
            const pinkMat = new THREE.MeshStandardMaterial({ color: 0xff99bb, roughness: 0.8 });
            const woodMat = new THREE.MeshStandardMaterial({ color: 0xdeb887, roughness: 0.6 }); 

            const body = new THREE.Mesh(new THREE.SphereGeometry(3.5, 32, 32), blackMat);
            body.scale.set(1, 0.9, 0.9); body.position.y = 3; catMachine.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(3.8, 32, 32), blackMat);
            head.position.y = 7.5; catMachine.add(head);

            const earL = new THREE.Mesh(new THREE.ConeGeometry(1.2, 2.5, 16), blackMat);
            earL.position.set(-2, 10.5, 0); earL.rotation.z = Math.PI / 8; catMachine.add(earL);
            const earR = new THREE.Mesh(new THREE.ConeGeometry(1.2, 2.5, 16), blackMat);
            earR.position.set(2, 10.5, 0); earR.rotation.z = -Math.PI / 8; catMachine.add(earR);

            const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), whiteMat);
            eyeL.scale.set(1, 1.2, 0.5); eyeL.position.set(-1.5, 8.5, 3.4); catMachine.add(eyeL);
            const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), whiteMat);
            eyeR.scale.set(1, 1.2, 0.5); eyeR.position.set(1.5, 8.5, 3.4); catMachine.add(eyeR);
            const pupilL = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), blackMat);
            pupilL.scale.set(1, 1.5, 0.5); pupilL.position.set(-1.5, 8.5, 3.8); catMachine.add(pupilL);
            const pupilR = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), blackMat);
            pupilR.scale.set(1, 1.5, 0.5); pupilR.position.set(1.5, 8.5, 3.8); catMachine.add(pupilR);

            const nose = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), pinkMat);
            nose.position.set(0, 7.2, 3.8); catMachine.add(nose);
            const mouth = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.4, 16, 32), woodMat);
            mouth.position.set(0, 5.5, 3.6); catMachine.add(mouth);
            const hole = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.5, 32), new THREE.MeshBasicMaterial({ color: 0x000000 }));
            hole.rotation.x = Math.PI / 2; hole.position.set(0, 5.5, 3.5); catMachine.add(hole);

            armL = new THREE.Group();
            const armMeshL = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.5, 2.5, 16), blackMat);
            armMeshL.position.y = -1.25; armL.add(armMeshL);
            const pawL = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), whiteMat);
            pawL.position.y = -2.5; armL.add(pawL);
            armL.position.set(-3.5, 4, 1); armL.rotation.z = Math.PI / 8;
            catMachine.add(armL);

            armR = new THREE.Group();
            const armMeshR = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.5, 2.5, 16), blackMat);
            armMeshR.position.y = -1.25; armR.add(armMeshR);
            const pawR = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), whiteMat);
            pawR.position.y = -2.5; armR.add(pawR);
            armR.position.set(3.5, 4, 1); armR.rotation.z = -Math.PI / 8;
            catMachine.add(armR);

            catMachine.position.set(0, 0, -26); 
            scene.add(catMachine);

            // --- 勝利演出用：純手工 3D 8+9 橘貓 ---
            bossCat = new THREE.Group();
            const orangeMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.7 }); 
            const bellyMat = new THREE.MeshStandardMaterial({ color: 0xffedd5, roughness: 0.9 }); 
            const blackClothingMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.9 }); 
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.3, metalness: 0.9 });

            const bossBody = new THREE.Mesh(new THREE.SphereGeometry(4.2, 32, 32), blackClothingMat);
            bossBody.scale.set(1, 0.9, 0.9); bossBody.position.y = 3.5; bossCat.add(bossBody);
            
            const bossBelly = new THREE.Mesh(new THREE.SphereGeometry(3.5, 32, 32), bellyMat);
            bossBelly.scale.set(1, 0.8, 0.5); bossBelly.position.set(0, 2.5, 2.5); bossCat.add(bossBelly);

            const bossHead = new THREE.Mesh(new THREE.SphereGeometry(4.0, 32, 32), orangeMat);
            bossHead.position.y = 8.5; bossCat.add(bossHead);
            
            const bossEarL = new THREE.Mesh(new THREE.ConeGeometry(1.2, 2.5, 16), orangeMat);
            bossEarL.position.set(-2, 11.5, 0); bossEarL.rotation.z = Math.PI / 8; bossCat.add(bossEarL);
            const bossEarR = new THREE.Mesh(new THREE.ConeGeometry(1.2, 2.5, 16), orangeMat);
            bossEarR.position.set(2, 11.5, 0); bossEarR.rotation.z = -Math.PI / 8; bossCat.add(bossEarR);

            // 反戴鴨舌帽
            const hatDome = new THREE.Mesh(new THREE.SphereGeometry(4.1, 32, 16, 0, Math.PI * 2, 0, Math.PI/2), blackClothingMat);
            hatDome.position.y = 8.5; bossCat.add(hatDome);
            const hatBrim = new THREE.Mesh(new THREE.CylinderGeometry(4.1, 4.1, 0.2, 32), blackClothingMat);
            hatBrim.position.set(0, 9.0, -3.0); hatBrim.rotation.x = -Math.PI / 12; bossCat.add(hatBrim);

            // 黑墨鏡
            const bossGlassMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.8 });
            const bGlassL = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.4, 0.4), bossGlassMat); bGlassL.position.set(-1.3, 9.0, 3.8);
            const bGlassR = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.4, 0.4), bossGlassMat); bGlassR.position.set(1.3, 9.0, 3.8);
            const bBridge = new THREE.Mesh(new THREE.BoxGeometry(1, 0.3, 0.2), bossGlassMat); bBridge.position.set(0, 9.0, 3.8);
            bossCat.add(bGlassL, bGlassR, bBridge);

            // 香菸
            const cigGroup = new THREE.Group();
            const cigBody = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.5, 8), new THREE.MeshBasicMaterial({color: 0xffffff}));
            cigBody.rotation.z = Math.PI / 2;
            const cigTip = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.4, 8), new THREE.MeshBasicMaterial({color: 0xd97706}));
            cigTip.rotation.z = Math.PI / 2; cigTip.position.x = 0.95;
            cigGroup.add(cigBody, cigTip);
            cigGroup.position.set(1.5, 7.5, 4.0); cigGroup.rotation.set(0, -Math.PI / 6, -Math.PI / 8);
            bossCat.add(cigGroup);

            // 大金項鍊
            const bChain = new THREE.Mesh(new THREE.TorusGeometry(3.8, 0.4, 16, 32), goldMat);
            bChain.rotation.x = Math.PI / 2 + 0.3; bChain.position.set(0, 5.0, 1.8);
            const pendant = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.2, 16), goldMat);
            pendant.rotation.x = Math.PI / 2; pendant.position.set(0, 2.5, 4.5);
            bossCat.add(bChain, pendant);

            bossArmL = new THREE.Group();
            const bArmMeshL = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 0.9, 3.5, 16), orangeMat);
            bArmMeshL.position.y = -1.75; bossArmL.add(bArmMeshL);
            bossArmL.position.set(-4.5, 5.5, 1); bossArmL.rotation.z = Math.PI / 6; bossCat.add(bossArmL);

            bossArmR = new THREE.Group();
            const bArmMeshR = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 0.9, 3.5, 16), orangeMat);
            bArmMeshR.position.y = -1.75; bossArmR.add(bArmMeshR);
            bossArmR.position.set(4.5, 5.5, 1); bossArmR.rotation.z = -Math.PI / 6; bossCat.add(bossArmR);

            bossCat.visible = false; 
            bossCat.position.set(0, 0, -26); 
            scene.add(bossCat);

            // --- 失敗演出用：嘲諷 3D 猴子 ---
            monkey = new THREE.Group();
            const monkeyBrown = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.9 });
            const monkeyLight = new THREE.MeshStandardMaterial({ color: 0xD2B48C, roughness: 1.0 });

            const mBody = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 3, 5, 32), monkeyBrown);
            mBody.position.y = 2.5; monkey.add(mBody);
            const mBelly = new THREE.Mesh(new THREE.CylinderGeometry(2, 2.5, 4.5, 16), monkeyLight);
            mBelly.position.set(0, 2.5, 0.8); monkey.add(mBelly);

            const mHead = new THREE.Mesh(new THREE.SphereGeometry(3, 32, 32), monkeyBrown);
            mHead.position.y = 7; monkey.add(mHead);
            const mFace = new THREE.Mesh(new THREE.SphereGeometry(2.5, 32, 32), monkeyLight);
            mFace.position.set(0, 6.8, 1.2); mFace.scale.set(1, 0.9, 0.8); monkey.add(mFace);

            const mEarL = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.5, 16), monkeyLight);
            mEarL.position.set(-3.2, 7, 0); mEarL.rotation.z = Math.PI/2; monkey.add(mEarL);
            const mEarR = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.5, 16), monkeyLight);
            mEarR.position.set(3.2, 7, 0); mEarR.rotation.z = Math.PI/2; monkey.add(mEarR);

            const mEyeL = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), blackMat);
            mEyeL.position.set(-1, 7.5, 3); monkey.add(mEyeL);
            const mEyeR = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), blackMat);
            mEyeR.position.set(1, 7.5, 3); monkey.add(mEyeR);

            const mMouth = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.2, 16, 32), blackMat);
            mMouth.position.set(0, 5.8, 3.2); monkey.add(mMouth);

            monkeyArmL = new THREE.Group();
            const mArmMeshL = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 5, 16), monkeyBrown);
            mArmMeshL.position.y = -2.5; monkeyArmL.add(mArmMeshL);
            monkeyArmL.position.set(-3.5, 5, 0); monkeyArmL.rotation.z = Math.PI / 4; monkey.add(monkeyArmL);

            monkeyArmR = new THREE.Group();
            const mArmMeshR = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 5, 16), monkeyBrown);
            mArmMeshR.position.y = -2.5; monkeyArmR.add(mArmMeshR);
            monkeyArmR.position.set(3.5, 5, 0); monkeyArmR.rotation.z = -Math.PI / 4; monkey.add(monkeyArmR);

            const mTail = new THREE.Mesh(new THREE.TorusGeometry(2.5, 0.4, 16, 32, Math.PI), monkeyBrown);
            mTail.position.set(0, 1.5, -2.5); mTail.rotation.y = Math.PI / 2; mTail.rotation.z = Math.PI / 4; monkey.add(mTail);

            monkey.visible = false;
            monkey.position.set(0, 0, -26);
            scene.add(monkey);
        }

        function stopAudio() {
            if (bgmLoops.length > 0) {
                Tone.Transport.stop();
                bgmLoops.forEach(loop => loop.stop());
            }
        }

        function setupEventListeners() {
            document.getElementById('start-btn').addEventListener('click', async () => {
                await Tone.start();
                initAudio();
                startGame();
            });

            restartBtn.addEventListener('click', startGame);
            
            quitBtn.addEventListener('click', () => {
                gameState.isPlaying = false;
                gameState.ballInPlay = false;
                gameState.victoryDance = false;
                gameState.loseDance = false;
                gameState.isPreparingServe = false;
                
                catMachine.visible = true; 
                bossCat.visible = false;
                monkey.visible = false;
                
                stopAudio(); 
                
                document.body.classList.remove('playing');
                startScreen.classList.remove('hidden');
                quitBtn.classList.add('hidden');
                ballCountEl.classList.add('hidden');
            });

            const updateMousePosition = (clientX, clientY) => {
                mouse.x = (clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            };

            document.addEventListener('mousemove', (event) => {
                if(!gameState.isPlaying) return;
                updateMousePosition(event.clientX, event.clientY);
            });

            document.addEventListener('touchmove', (event) => {
                if(!gameState.isPlaying) return;
                event.preventDefault(); 
                updateMousePosition(event.touches[0].clientX, event.touches[0].clientY);
            }, { passive: false });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function resetBall() {
            ballBody.type = CANNON.Body.KINEMATIC;
            ballBody.velocity.set(0, 0, 0);
            ballBody.angularVelocity.set(0, 0, 0);
            ballBody.position.set(0, -100, 0); 
            gameState.ballInPlay = false;

            // 準備發球：極度縮小隨機瞄準角度 (正負約 3.7 度內)，保證球絕對在窄螢幕的視野中央
            gameState.isPreparingServe = true;
            gameState.targetServeAngle = (Math.random() - 0.5) * (Math.PI / 24);

            setTimeout(() => {
                if(!gameState.isPlaying) return;
                
                gameState.isPreparingServe = false; // 準備結束，發射！
                
                ballBody.type = CANNON.Body.DYNAMIC;
                ballBody.position.set(0, 5.5, -24); // 從貓咪嘴巴出現
                
                // 🚀 極限 2 倍速平擊發球！
                const speedBase = 130 + Math.random() * 20; // Z軸速度極快，約130~150
                const arcBase = 5 + Math.random() * 2;      // Y軸拋物線極低，確保落在好接的高度
                
                // 根據貓咪實際面向的角度，計算 X 軸的發射速度
                const actualAngle = catMachine.rotation.y;
                const velocityX = Math.tan(actualAngle) * speedBase;
                
                ballBody.velocity.set(velocityX, arcBase, speedBase);
                ballBody.angularVelocity.set(20, (Math.random()-0.5)*10, 0);
                
                if (wallSynth) wallSynth.triggerAttackRelease("16n"); 
                
                gameState.ballInPlay = true; 
            }, 1000); 
        }

        function updateScore(scorer) {
            gameState.ballsPlayed++;
            
            if (scorer === 'player') {
                gameState.score.player++;
                playerScoreEl.textContent = gameState.score.player;
                if (hitSynth) {
                    hitSynth.triggerAttackRelease("C4", "8n");
                    setTimeout(() => hitSynth.triggerAttackRelease("E4", "8n"), 150);
                }
            } else {
                gameState.score.ai++;
                aiScoreEl.textContent = gameState.score.ai;
                if (gameOverSynth) {
                    gameOverSynth.triggerAttackRelease(["C3", "Eb3", "G3"], "4n");
                }
            }
            
            ballCountEl.textContent = `球數: ${Math.min(gameState.ballsPlayed + 1, gameState.maxBalls)} / ${gameState.maxBalls}`;
            
            if (gameState.ballsPlayed >= gameState.maxBalls) {
                setTimeout(endGame, 1000);
            } else if (gameState.isPlaying) {
                resetBall(); 
            }
        }

        function startGame() {
            gameState.score = { player: 0, ai: 0 };
            gameState.ballsPlayed = 0;
            playerScoreEl.textContent = '0';
            aiScoreEl.textContent = '0';
            ballCountEl.textContent = `球數: 1 / 5`;
            
            gameState.isPlaying = true;
            gameState.ballInPlay = false;
            gameState.isPreparingServe = false;
            gameState.victoryDance = false;
            gameState.loseDance = false;

            catMachine.visible = true;
            bossCat.visible = false;
            monkey.visible = false;
            bossCat.position.set(0, 0, -26); 
            monkey.position.set(0, 0, -26); 
            
            gameOverScreen.style.background = '';
            document.body.classList.add('playing'); 
            
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            quitBtn.classList.remove('hidden');
            ballCountEl.classList.remove('hidden');
            
            if (bgmLoops.length > 0) {
                Tone.Transport.start();
                bgmLoops.forEach(loop => loop.start(0));
            }
            
            resetBall();
        }

        function fireConfetti() {
            var duration = 3000; 
            var end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff69b4', '#4ade80', '#87CEEB', '#f59e0b'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff69b4', '#4ade80', '#87CEEB', '#f59e0b'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function endGame() {
            gameState.isPlaying = false;
            gameState.ballInPlay = false;
            document.body.classList.remove('playing'); 
            
            stopAudio(); 
            
            quitBtn.classList.add('hidden');
            ballCountEl.classList.add('hidden');
            
            gameOverScreen.classList.remove('hidden');
            document.getElementById('final-player-score').textContent = gameState.score.player;
            document.getElementById('final-ai-score').textContent = gameState.score.ai;
            
            if (gameState.score.player > gameState.score.ai) {
                winnerText.textContent = "挑戰成功！";
                winnerText.className = "text-7xl font-black mb-2 text-pink-400 drop-shadow-lg tracking-wider";
                winnerSub.textContent = "YOU WIN!";
                winnerSub.className = "text-xl text-pink-300 font-bold tracking-widest drop-shadow-md";
                
                gameState.victoryDance = true;
                gameState.loseDance = false;
                catMachine.visible = false;
                monkey.visible = false;
                bossCat.visible = true; 
                
                gameOverScreen.style.background = 'rgba(0, 0, 0, 0.4)';
                gameOverScreen.style.backdropFilter = 'none';
                
                fireConfetti();

                if(gameOverSynth) gameOverSynth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "1n"); 
            } else {
                winnerText.textContent = (gameState.score.ai > gameState.score.player) ? "挑戰失敗！" : "平手！";
                winnerText.className = `text-7xl font-black mb-2 ${gameState.score.ai > gameState.score.player ? 'text-blue-400' : 'text-white'} drop-shadow-lg tracking-wider`;
                winnerSub.textContent = (gameState.score.ai > gameState.score.player) ? "YOU LOSE..." : "DRAW GAME";
                winnerSub.className = "text-xl text-gray-400 font-bold tracking-widest drop-shadow-md";
                
                gameState.loseDance = true;
                gameState.victoryDance = false;
                catMachine.visible = false;
                bossCat.visible = false;
                monkey.visible = true; 
                
                gameOverScreen.style.background = 'rgba(0, 0, 0, 0.6)';
                gameOverScreen.style.backdropFilter = 'none';
                
                if(gameOverSynth) gameOverSynth.triggerAttackRelease(["C3", "G2"], "1n"); 
            }
        }

        const timeStep = 1 / 60;
        
        function animate() {
            animationId = requestAnimationFrame(animate);
            time += 0.05; 

            if (gameState.isPlaying) {
                world.step(timeStep);
                
                // 100% 精準對齊射線投影：游標在哪，球拍就在哪！
                raycaster.setFromCamera(mouse, camera);
                if (raycaster.ray.direction.z !== 0) {
                    const t = (RACKET_Z_PLANE - raycaster.ray.origin.z) / raycaster.ray.direction.z;
                    const hitX = raycaster.ray.origin.x + raycaster.ray.direction.x * t;
                    const hitY = raycaster.ray.origin.y + raycaster.ray.direction.y * t;
                    
                    paddle1.position.set(hitX, hitY, RACKET_Z_PLANE);
                    paddle1.rotation.y = -hitX * 0.02;
                    paddle1.rotation.x = -Math.PI / 10 + (hitY - 5) * 0.02;
                }

                ball.position.copy(ballBody.position);
                ball.quaternion.copy(ballBody.quaternion);
                
                if (shakeIntensity > 0) {
                    camera.position.x = defaultCameraPos.x + (Math.random() - 0.5) * shakeIntensity;
                    camera.position.y = defaultCameraPos.y + (Math.random() - 0.5) * shakeIntensity;
                    shakeIntensity -= 0.05;
                } else {
                    camera.position.lerp(defaultCameraPos, 0.1);
                }
                
                // 暴力回擊 Hitbox 判定
                if (gameState.ballInPlay && ballBody.velocity.z > 0) {
                    const pX = paddle1.position.x, pY = paddle1.position.y, pZ = paddle1.position.z;
                    const bX = ballBody.position.x, bY = ballBody.position.y, bZ = ballBody.position.z;

                    // 優化：放大 Y 和 X 的容錯率 (2.2)，確保「視覺上碰到球拍外框」就算擊中！
                    if (Math.abs(bZ - pZ) < 12.0 && Math.abs(bX - pX) < 2.2 && Math.abs(bY - pY) < 2.2) {
                        let hitOffsetX = bX - pX;
                        // 優化：給予一個固定的向上托力 (8)，確保高速抽球不會掛網，劃出完美拋物線
                        ballBody.velocity.set(hitOffsetX * 5, 8, -160); 
                        ballBody.angularVelocity.set(Math.random()*30, Math.random()*30, 0);
                        
                        shakeIntensity = 1.5; // 加強擊中時的震動回饋
                        
                        if (hitSynth) hitSynth.triggerAttackRelease("C2", "8n"); 
                    }
                }

                // 出界與落地判定
                if (gameState.ballInPlay) {
                    const catZLimit = -27; 
                    const playerZLimit = RACKET_Z_PLANE + 5; 
                    const sideLimit = gameState.tableWidth / 2 + 8; 

                    let scored = false;
                    let scorer = '';

                    const bZ = ballBody.position.z;
                    const bY = ballBody.position.y;
                    const bX = ballBody.position.x;

                    if (bZ < catZLimit && bY < 15) { 
                        scored = true; scorer = 'player';
                    } else if (bZ > playerZLimit) {
                        scored = true; scorer = 'ai';
                    } else if (bY < 0.4) {
                        if (wallSynth) wallSynth.triggerAttackRelease("32n"); 
                        scored = true;
                        scorer = (bZ > 0) ? 'ai' : 'player'; 
                    } else if (Math.abs(bX) > sideLimit) {
                        scored = true; scorer = 'ai'; 
                    }

                    if (scored) {
                        gameState.ballInPlay = false; 
                        updateScore(scorer);
                    }
                }
                
                // 黑貓待機動畫與發球轉向
                catMachine.position.y = Math.sin(time * 0.5) * 0.3;
                
                if (gameState.isPreparingServe) {
                    // 準備發球期間：平滑轉向隨機的發球目標角度
                    catMachine.rotation.y += (gameState.targetServeAngle - catMachine.rotation.y) * 0.1;
                } else if (ballBody.position.y > 0 && gameState.ballInPlay) {
                    // 球擊出後：視線追蹤球
                    const targetRotationY = Math.max(-Math.PI/6, Math.min(Math.PI/6, ballBody.position.x * 0.02));
                    catMachine.rotation.y += (targetRotationY - catMachine.rotation.y) * 0.1;
                } else {
                    // 預設緩慢回正
                    catMachine.rotation.y += (0 - catMachine.rotation.y) * 0.05;
                }

                if (armL && armR) {
                    armL.rotation.x = Math.sin(time * 3) * 0.5;
                    armR.rotation.x = Math.sin(time * 3 + Math.PI) * 0.5; 
                }
                
            } else if (gameState.victoryDance && bossCat.visible) {
                 // 8+9 貓咪狂舞動畫 (勝利)
                 const danceTime = time * 12;
                 bossCat.position.y = 2 + Math.abs(Math.sin(danceTime * 0.5)) * 5; 
                 bossCat.rotation.y += 0.12; 
                 bossCat.rotation.z = Math.sin(danceTime * 0.3) * 0.3; 
                 bossCat.position.z += ( -10 - bossCat.position.z ) * 0.05; 
                 
                 if (bossArmL && bossArmR) {
                     bossArmL.rotation.x = danceTime;
                     bossArmR.rotation.x = -danceTime;
                 }
            } else if (gameState.loseDance && monkey.visible) {
                 // 嘲諷猴子狂舞動畫 (失敗)
                 const danceTime = time * 15;
                 monkey.position.y = Math.abs(Math.sin(danceTime * 0.4)) * 7; 
                 monkey.rotation.y = Math.sin(danceTime * 0.2) * 0.5; 
                 monkey.position.z += ( -8 - monkey.position.z ) * 0.08; 
                 
                 if (monkeyArmL && monkeyArmR) {
                     monkeyArmL.rotation.x = Math.sin(danceTime) * 1.5;
                     monkeyArmR.rotation.x = -Math.sin(danceTime) * 1.5;
                     monkeyArmL.rotation.z = Math.PI/3 + Math.sin(danceTime)*0.8;
                     monkeyArmR.rotation.z = -Math.PI/3 - Math.sin(danceTime)*0.8;
                 }
            } else {
                 // 標題畫面待機動畫
                 catMachine.position.y = Math.sin(time * 0.5) * 0.3;
                 catMachine.rotation.y = Math.sin(time * 0.2) * 0.2; 
                 if (armL && armR) {
                     armL.rotation.x = Math.sin(time * 2) * 0.2;
                     armR.rotation.x = Math.sin(time * 2 + Math.PI) * 0.2; 
                 }
            }

            renderer.render(scene, camera);
        }

        window.onload = () => {
            initGraphics();
            const mat = initPhysics();
            createObjects(mat);
            setupEventListeners();
            
            renderer.render(scene, camera);
            animate();
        };
    </script>
