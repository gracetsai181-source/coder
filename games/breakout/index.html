<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Breakout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none; /* Prevent scrolling on touch */
        }

        #game-wrapper {
            position: relative;
            background-color: #1e293b; /* Slate 800 */
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 860px;
        }

        canvas {
            background-color: #020617; /* Slate 950 */
            border-radius: 8px;
            display: block;
            max-width: 100%;
            height: auto;
            aspect-ratio: 4 / 3;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            border: 2px solid #334155; /* Slate 700 */
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85); /* Slate 900 with opacity */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        #overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        .canvas-container {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <!-- Header / Scoreboard -->
        <div class="w-full flex justify-between items-center mb-4 px-2">
            <h1 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                BREAKOUT
            </h1>
            <div class="text-xl font-semibold bg-slate-700 px-4 py-1 rounded-full shadow-inner border border-slate-600">
                Score: <span id="scoreDisplay" class="text-cyan-300 font-mono">0</span>
            </div>
        </div>

        <!-- Canvas Container -->
        <div class="canvas-container">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            
            <!-- Dynamic Overlay (Start / Game Over / Victory) -->
            <div id="overlay">
                <h2 id="overlay-title" class="text-5xl font-extrabold mb-4 text-white tracking-widest drop-shadow-lg">
                    BREAKOUT
                </h2>
                <p id="overlay-subtitle" class="text-xl text-slate-300 mb-8 font-medium">
                    Press Space or Tap to Start
                </p>
                <button id="action-btn" class="px-8 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white text-lg font-bold rounded-full shadow-lg shadow-cyan-500/30 transition-all duration-200 transform hover:scale-105 active:scale-95">
                    PLAY NOW
                </button>
            </div>
        </div>
        
        <!-- Controls Hint -->
        <div class="mt-5 text-sm text-slate-400 font-medium flex gap-4">
            <span class="flex items-center gap-1"><kbd class="bg-slate-700 px-2 py-1 rounded border border-slate-600">←</kbd> <kbd class="bg-slate-700 px-2 py-1 rounded border border-slate-600">→</kbd> Move</span>
            <span class="flex items-center gap-1"><kbd class="bg-slate-700 px-2 py-1 rounded border border-slate-600">Space</kbd> Start / Pause</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlaySubtitle = document.getElementById('overlay-subtitle');
        const actionBtn = document.getElementById('action-btn');

        // Internal resolution for game logic
        const CW = canvas.width;
        const CH = canvas.height;

        // Game States
        const STATE = { START: 0, PLAYING: 1, PAUSED: 2, GAMEOVER: 3, VICTORY: 4 };
        let gameState = STATE.START;
        let score = 0;
        let animationId;

        // --- Tone.js 音效與配樂系統 ---
        let audioInitialized = false;
        let sfxSynth, bassSynth, bgmSynth, bassPart, arpPart;

        function initAudio() {
            if (audioInitialized) return;
            audioInitialized = true;
            
            // 8-bit 風格音效產生器
            sfxSynth = new Tone.Synth({
                oscillator: { type: 'square' },
                envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 }
            }).toDestination();
            sfxSynth.volume.value = -8;

            // 緊張的重低音 (Bass)
            bassSynth = new Tone.Synth({
                oscillator: { type: 'sawtooth' },
                envelope: { attack: 0.01, decay: 0.2, sustain: 0.2, release: 0.2 }
            }).toDestination();
            bassSynth.volume.value = -12;

            // 快速的琶音 (Arpeggio)
            bgmSynth = new Tone.Synth({
                oscillator: { type: 'square' },
                envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.1 }
            }).toDestination();
            bgmSynth.volume.value = -18;

            Tone.Transport.bpm.value = 160;

            // 低音節奏
            const bassNotes = ["C2", "C2", "C2", "C2", "D#2", "D#2", "F2", "G2"];
            bassPart = new Tone.Sequence((time, note) => {
                bassSynth.triggerAttackRelease(note, "8n", time);
            }, bassNotes, "8n");

            // 緊張感琶音旋律
            const arpNotes = ["C4", "D#4", "G4", "C5", "G4", "D#4", "C4", "G3"];
            arpPart = new Tone.Sequence((time, note) => {
                bgmSynth.triggerAttackRelease(note, "16n", time);
            }, arpNotes, "16n");
        }
        
        function playSfx(type) {
            if (!audioInitialized) return;
            if (type === 'paddle') sfxSynth.triggerAttackRelease("C3", "8n");
            else if (type === 'brick') sfxSynth.triggerAttackRelease("G4", "16n");
            else if (type === 'over') sfxSynth.triggerAttackRelease("C2", "2n");
            else if (type === 'win') sfxSynth.triggerAttackRelease("C5", "4n");
        }
        // ---------------------------

        // Keyboard State
        const keys = { right: false, left: false };

        const ball = {
            x: CW / 2,
            y: CH - 60,
            radius: 8,
            speed: 6,
            dx: 4,
            dy: -4,
            color: '#22d3ee' // Cyan 400
        };

        const paddle = {
            width: 120,
            height: 16,
            x: CW / 2 - 60,
            y: CH - 30,
            speed: 9,
            color: '#3b82f6', // Blue 500
            shadowColor: '#60a5fa'
        };

        const brickConfig = {
            rows: 6,
            cols: 10,
            width: 64,
            height: 24,
            padding: 12,
            offsetTop: 70,
            offsetLeft: 0 // Calculated dynamically
        };
        let bricks = [];

        // Brick Colors by row
        const rowColors = [
            '#ef4444', // Red 500
            '#f97316', // Orange 500
            '#eab308', // Yellow 500
            '#22c55e', // Green 500
            '#06b6d4', // Cyan 500
            '#8b5cf6'  // Violet 500
        ];

        function createLevel() {
            bricks = [];
            // Center the block of bricks
            const totalWidth = (brickConfig.cols * brickConfig.width) + ((brickConfig.cols - 1) * brickConfig.padding);
            brickConfig.offsetLeft = (CW - totalWidth) / 2;

            for (let r = 0; r < brickConfig.rows; r++) {
                bricks[r] = [];
                for (let c = 0; c < brickConfig.cols; c++) {
                    bricks[r][c] = { 
                        x: 0, 
                        y: 0, 
                        active: true,
                        color: rowColors[r % rowColors.length]
                    };
                }
            }
        }

        function resetGame() {
            score = 0;
            scoreDisplay.textContent = score;
            ball.speed = 6;
            
            // Reset Paddle
            paddle.x = CW / 2 - paddle.width / 2;
            
            // Reset Ball
            ball.x = CW / 2;
            ball.y = paddle.y - ball.radius - 5;
            
            // Randomize starting X direction
            const startAngle = (Math.random() * (Math.PI/4)) + Math.PI/4; // Angle between 45 and 135 deg
            const direction = Math.random() > 0.5 ? 1 : -1;
            ball.dx = ball.speed * Math.cos(startAngle) * direction;
            ball.dy = -ball.speed * Math.sin(startAngle);

            createLevel();
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.shadowColor = ball.color;
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0; // Reset shadow
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 8);
            ctx.fillStyle = paddle.color;
            ctx.fill();
            
            // Inner highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.roundRect(paddle.x + 2, paddle.y + 2, paddle.width - 4, paddle.height / 2.5, 4);
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            for (let r = 0; r < brickConfig.rows; r++) {
                for (let c = 0; c < brickConfig.cols; c++) {
                    if (bricks[r][c].active) {
                        const b = bricks[r][c];
                        const bX = (c * (brickConfig.width + brickConfig.padding)) + brickConfig.offsetLeft;
                        const bY = (r * (brickConfig.height + brickConfig.padding)) + brickConfig.offsetTop;
                        
                        b.x = bX;
                        b.y = bY;
                        
                        ctx.beginPath();
                        ctx.roundRect(bX, bY, brickConfig.width, brickConfig.height, 4);
                        ctx.fillStyle = b.color;
                        ctx.fill();
                        
                        // Suble 3D top edge
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                        ctx.fillRect(bX, bY, brickConfig.width, 3);
                        // Subtle 3D bottom edge
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                        ctx.fillRect(bX, bY + brickConfig.height - 3, brickConfig.width, 3);
                        
                        ctx.closePath();
                    }
                }
            }
        }

        function updateLogic() {
            // Move Paddle
            if (keys.right && paddle.x < CW - paddle.width) {
                paddle.x += paddle.speed;
            } else if (keys.left && paddle.x > 0) {
                paddle.x -= paddle.speed;
            }

            // Move Ball
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Wall Collision (Left & Right)
            if (ball.x + ball.radius > CW || ball.x - ball.radius < 0) {
                ball.dx *= -1;
                // Keep ball inside bounds
                ball.x = ball.x - ball.radius < 0 ? ball.radius : CW - ball.radius; 
            }

            // Wall Collision (Top)
            if (ball.y - ball.radius < 0) {
                ball.dy *= -1;
                ball.y = ball.radius;
            }

            // Floor Collision (Game Over)
            if (ball.y + ball.radius > CH) {
                triggerGameOver();
                return;
            }

            // Paddle Collision
            if (ball.dy > 0 && 
                ball.y + ball.radius >= paddle.y && 
                ball.y - ball.radius <= paddle.y + paddle.height &&
                ball.x + ball.radius >= paddle.x && 
                ball.x - ball.radius <= paddle.x + paddle.width) {
                
                // Calculate bounce angle based on where it hit the paddle
                let hitPoint = ball.x - (paddle.x + paddle.width / 2);
                hitPoint = hitPoint / (paddle.width / 2); // Normalized between -1 and 1
                
                const maxBounceAngle = Math.PI / 3; // 60 degrees
                const angle = hitPoint * maxBounceAngle;
                
                // Keep speed constant but change direction
                ball.dx = ball.speed * Math.sin(angle);
                ball.dy = -ball.speed * Math.cos(angle);
                
                // Nudge ball up to prevent sticking
                ball.y = paddle.y - ball.radius;
                
                playSfx('paddle');
            }

            // Brick Collision
            let activeBricksCount = 0;
            for (let r = 0; r < brickConfig.rows; r++) {
                for (let c = 0; c < brickConfig.cols; c++) {
                    const b = bricks[r][c];
                    if (b.active) {
                        activeBricksCount++;
                        // AABB collision logic
                        if (ball.x + ball.radius > b.x &&
                            ball.x - ball.radius < b.x + brickConfig.width &&
                            ball.y + ball.radius > b.y &&
                            ball.y - ball.radius < b.y + brickConfig.height) {
                            
                            // Determine hit side to bounce correctly
                            // Compare distance to closest edges
                            const distX = Math.abs(ball.x - (b.x + brickConfig.width/2));
                            const distY = Math.abs(ball.y - (b.y + brickConfig.height/2));
                            
                            if (distX > distY) {
                                ball.dx *= -1; // Hit left or right side
                            } else {
                                ball.dy *= -1; // Hit top or bottom side
                            }
                            
                            b.active = false;
                            score += 10;
                            scoreDisplay.textContent = score;
                            playSfx('brick');

                            // Speed progression
                            if (score % 100 === 0 && ball.speed < 12) {
                                ball.speed += 0.5;
                                const currentAngle = Math.atan2(ball.dy, ball.dx);
                                ball.dx = ball.speed * Math.cos(currentAngle);
                                ball.dy = ball.speed * Math.sin(currentAngle);
                            }
                        }
                    }
                }
            }

            if (activeBricksCount === 0) {
                triggerVictory();
            }
        }

        function drawAll() {
            // Clear canvas
            ctx.clearRect(0, 0, CW, CH);
            
            // Draw gradient background
            const bgGradient = ctx.createLinearGradient(0, 0, 0, CH);
            bgGradient.addColorStop(0, '#0f172a');
            bgGradient.addColorStop(1, '#020617');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, CW, CH);

            drawBricks();
            drawPaddle();
            drawBall();
        }

        function gameLoop() {
            if (gameState === STATE.PLAYING) {
                updateLogic();
                drawAll();
                animationId = requestAnimationFrame(gameLoop);
            } else if (gameState === STATE.START || gameState === STATE.PAUSED) {
                drawAll();
            }
        }

        function showOverlay(title, subtitle, btnText) {
            overlayTitle.textContent = title;
            overlaySubtitle.textContent = subtitle;
            actionBtn.textContent = btnText;
            overlay.classList.add('active');
        }

        function hideOverlay() {
            overlay.classList.remove('active');
        }

        async function startGame() {
            // 確保音訊功能在使用者互動後啟動 (瀏覽器限制)
            if (!audioInitialized) {
                await Tone.start();
                initAudio();
            }
            
            // 播放 BGM
            Tone.Transport.start();
            bassPart.start(0);
            arpPart.start(0);

            if (gameState === STATE.START || gameState === STATE.GAMEOVER || gameState === STATE.VICTORY) {
                resetGame();
            }
            gameState = STATE.PLAYING;
            hideOverlay();
            gameLoop();
        }

        function pauseGame() {
            gameState = STATE.PAUSED;
            if (audioInitialized) Tone.Transport.pause();
            cancelAnimationFrame(animationId);
            showOverlay('PAUSED', 'Take a breath', 'RESUME');
        }

        function triggerGameOver() {
            gameState = STATE.GAMEOVER;
            if (audioInitialized) {
                Tone.Transport.stop();
                playSfx('over');
            }
            cancelAnimationFrame(animationId);
            showOverlay('GAME OVER', `Final Score: ${score}`, 'TRY AGAIN');
        }

        function triggerVictory() {
            gameState = STATE.VICTORY;
            if (audioInitialized) {
                Tone.Transport.stop();
                playSfx('win');
            }
            cancelAnimationFrame(animationId);
            showOverlay('YOU WIN!', `Incredible! Score: ${score}`, 'PLAY AGAIN');
        }

        // Keyboard Controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Right') keys.right = true;
            if (e.key === 'ArrowLeft' || e.key === 'Left') keys.left = true;
            
            if (e.code === 'Space') {
                e.preventDefault(); // Prevent scrolling
                if (gameState === STATE.START || gameState === STATE.GAMEOVER || gameState === STATE.VICTORY) {
                    startGame();
                } else if (gameState === STATE.PLAYING) {
                    pauseGame();
                } else if (gameState === STATE.PAUSED) {
                    startGame();
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Right') keys.right = false;
            if (e.key === 'ArrowLeft' || e.key === 'Left') keys.left = false;
        });

        // UI Button action
        actionBtn.addEventListener('click', startGame);

        // Optional: Basic touch controls for mobile playability
        canvas.addEventListener('touchstart', handleTouch);
        canvas.addEventListener('touchmove', handleTouch);
        
        function handleTouch(e) {
            if(gameState !== STATE.PLAYING) return;
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            // Scale touch coordinates to canvas internal resolution
            const scaleX = canvas.width / rect.width;
            const touchX = (touch.clientX - rect.left) * scaleX;
            
            // Center paddle on touch
            paddle.x = touchX - paddle.width / 2;
            
            // Boundary checks
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > CW) paddle.x = CW - paddle.width;
        }

        // Initialization
        showOverlay('BREAKOUT', 'Press Space or Tap Play to Start', 'PLAY NOW');
        createLevel();
        drawAll(); // Draw initial static state
    </script>
</body>
</html>
